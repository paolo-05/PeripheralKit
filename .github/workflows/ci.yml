name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and test
        run: >-
          xcodebuild
          -project PeripheralKit.xcodeproj
          -scheme PeripheralKit
          -destination 'platform=macOS'
          test
          CODE_SIGNING_ALLOWED=NO
